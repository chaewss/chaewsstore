server:
  port: 8000

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:tcp://localhost/~/chaewsstore
    username: sa

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      jakarta:
        persistence:
          sharedCache:
            mode: ALL
jwt:
  header: Authorization
  secret: ${SECRET_KEY}

logging.level.org.springframework.core.LocalVariableTableParameterNameDiscoverer: error
